<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café LATTE — Панель офіціанта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
--gold-primary: #D4AF37;
--gold-light: #F3E5AB;
--purple-brand: #3D1E45;
--purple-dark: #2A1230;
--glass-bg: rgba(26, 12, 28, 0.85);
--glass-border: rgba(212, 175, 55, 0.4);
--text-light: #F8F5F0;
--text-muted: #C5B8C8;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: 'Montserrat', sans-serif;
color: var(--text-light);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #0D050E url('background-wall.jpg') no-repeat center center fixed;
background-size: cover;
position: relative;
padding: 16px;
}

body::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.2) 0%, transparent 60%), linear-gradient(135deg, rgba(13, 5, 14, 0.6) 0%, rgba(26, 12, 28, 0.8) 100%);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
z-index: 1;
}

.container {
position: relative;
z-index: 2;
width: 100%;
max-width: 400px;
padding: 32px 24px;
background: var(--glass-bg);
border: 1px solid var(--glass-border);
border-radius: 28px;
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.15);
text-align: center;
}

.logo {
width: 100px;
height: auto;
margin-bottom: 12px;
filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
}

.title {
font-family: 'Cormorant Garamond', serif;
font-size: 1.6rem;
font-weight: 700;
color: var(--gold-primary);
margin-bottom: 20px;
}

.form-group {
margin-bottom: 18px;
text-align: left;
}

label {
display: block;
font-size: 0.85rem;
color: var(--gold-light);
margin-bottom: 6px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.5px;
}

select, input {
width: 100%;
padding: 14px 16px;
background: rgba(18, 7, 20, 0.8);
border: 1px solid var(--glass-border);
border-radius: 14px;
color: var(--gold-primary);
font-size: 1.1rem;
font-family: 'Montserrat', sans-serif;
outline: none;
}

select option {
background: #120F0D;
color: var(--text-light);
}

.btn-submit {
width: 100%;
padding: 16px;
background: linear-gradient(145deg, var(--gold-primary), #B89028);
border: none;
border-radius: 16px;
color: #120F0D;
font-size: 1.05rem;
font-weight: 700;
cursor: pointer;
margin-top: 10px;
font-family: 'Montserrat', sans-serif;
box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
}

.result-box {
margin-top: 24px;
padding: 16px;
background: rgba(0, 0, 0, 0.4);
border: 1px dashed var(--glass-border);
border-radius: 16px;
display: none;
font-size: 0.9rem;
line-height: 1.5;
text-align: left;
}

.result-box strong {
color: var(--gold-primary);
}

.result-link {
display: block;
margin-top: 10px;
word-break: break-all;
color: var(--gold-light);
text-decoration: underline;
font-size: 0.82rem;
}

Олександр:
.footer-text {
margin-top: 20px;
font-size: 0.8rem;
color: var(--text-muted);
}
</style>
</head>
<body>

<div class="container">
<img src="logo-latte.png" alt="Latte Logo" class="logo">
<div class="title">Панель офіціанта</div>

<div class="form-group">
<label for="tableSelect">Оберіть номер столика:</label>
<select id="tableSelect">
<option value="1">Стіл № 1</option>
<option value="2">Стіл № 2</option>
<option value="3">Стіл № 3</option>
<option value="4">Стіл № 4</option>
<option value="5">Стіл № 5</option>
<option value="6">Стіл № 6</option>
<option value="7">Стіл № 7</option>
<option value="8">Стіл № 8</option>
</select>
</div>

<div class="form-group">
<label for="billInput">Сума чека (грн):</label>
<input type="number" id="billInput" placeholder="Наприклад: 380" min="1">
</div>

<button class="btn-submit" onclick="saveBill()">Встановити рахунок</button>

<div class="result-box" id="resultBox">
<div>✅ Рахунок <strong id="resBill">0</strong> грн призначено для <strong id="resTable">Стіл №--</strong>!</div>
<a href="#" id="resLink" target="_blank" class="result-link">Відкрити сторінку чека</a>
</div>

<div class="footer-text">Café LATTE • Управління чеками</div>
</div>

<script>
function saveBill() {
const table = document.getElementById('tableSelect').value;
const bill = parseFloat(document.getElementById('billInput').value);

if (!bill || bill <= 0) {
alert('Будь ласка, введіть коректну суму чека!');
return;
}

localStorage.setItem(table_bill_${table}, bill);

const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
const guestUrl = ${baseUrl}/index.html?table=${table}&bill=${bill};

document.getElementById('resBill').innerText = bill;
document.getElementById('resTable').innerText = Стіл №${table};

const resLink = document.getElementById('resLink');
resLink.href = guestUrl;
resLink.innerText = guestUrl;

document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
