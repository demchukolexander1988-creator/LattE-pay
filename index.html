<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café LATTE — Оплата та подяка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
--gold-primary: #D4AF37;
--gold-hover: #F3E5AB;
--bg-dark: rgba(18, 15, 13, 0.88);
--card-bg: rgba(255, 255, 255, 0.05);
--border-gold: rgba(212, 175, 55, 0.3);
--text-light: #F8F5F0;
--text-muted: #A8A29E;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: 'Montserrat', sans-serif;
color: var(--text-light);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #000 url('background-wall.jpg') no-repeat center center fixed;
background-size: cover;
position: relative;
}

body::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: radial-gradient(circle, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.92) 100%);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
z-index: 1;
}

.container {
position: relative;
z-index: 2;
width: 100%;
max-width: 420px;
padding: 32px 24px;
margin: 16px;
background: var(--bg-dark);
border: 1px solid var(--border-gold);
border-radius: 24px;
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
text-align: center;
}

.logo {
width: 110px;
height: auto;
margin-bottom: 16px;
filter: drop-shadow(0 4px 10px rgba(212, 175, 55, 0.2));
}

.subtitle {
font-family: 'Cormorant Garamond', serif;
font-size: 1.35rem;
font-weight: 600;
color: var(--gold-primary);
margin-bottom: 8px;
}

.appreciation-text {
font-size: 0.95rem;
color: var(--text-muted);
margin-bottom: 20px;
line-height: 1.4;
}

.table-badge {
display: inline-block;
padding: 6px 18px;
background: rgba(212, 175, 55, 0.1);
border: 1px solid var(--border-gold);
border-radius: 20px;
font-size: 0.85rem;
color: var(--gold-primary);
margin-bottom: 24px;
letter-spacing: 1px;
font-weight: 500;
}

.buttons-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
margin-bottom: 12px;
}

.btn-option {
background: var(--card-bg);
border: 1px solid var(--border-gold);
color: var(--text-light);
padding: 16px 8px;
font-size: 1.1rem;
font-weight: 600;
border-radius: 14px;
cursor: pointer;
transition: all 0.25s ease;
font-family: 'Montserrat', sans-serif;
}

.btn-option:active {
transform: scale(0.97);
}

.btn-option:hover {
background: var(--gold-primary);
color: #120F0D;
border-color: var(--gold-primary);
}

.btn-custom {
grid-column: span 3;
background: rgba(255, 255, 255, 0.03);
}

.btn-skip {
width: 100%;
background: transparent;
border: 1px solid rgba(255, 255, 255, 0.15);
color: var(--text-muted);
padding: 14px;
font-size: 0.95rem;
border-radius: 14px;
cursor: pointer;
margin-top: 8px;
transition: all 0.25s ease;
}

.btn-skip:hover {
border-color: rgba(255, 255, 255, 0.4);
color: var(--text-light);
}

.custom-input-container {
display: none;
margin-bottom: 16px;
}

Олександр:
.custom-input {
width: 100%;
padding: 14px;
background: rgba(0, 0, 0, 0.4);
border: 1px solid var(--gold-primary);
border-radius: 12px;
color: var(--gold-primary);
font-size: 1.1rem;
text-align: center;
outline: none;
}

.custom-submit-btn {
width: 100%;
margin-top: 8px;
padding: 12px;
background: var(--gold-primary);
color: #120F0D;
font-weight: 600;
border: none;
border-radius: 12px;
cursor: pointer;
}

.footer {
margin-top: 28px;
padding-top: 18px;
border-top: 1px solid rgba(255, 255, 255, 0.08);
font-size: 0.85rem;
color: var(--text-muted);
line-height: 1.8;
}

.footer a {
color: var(--gold-primary);
text-decoration: none;
}
</style>
</head>
<body>

<div class="container">
<img src="logo-latte.png" alt="Latte Logo" class="logo">

<div class="subtitle">Місце, де затишок та смак зустрічаються</div>
<div class="appreciation-text">Якщо вам сподобалось, команді буде дуже приємно ❤️</div>

<div class="table-badge" id="tableBadge">Стіл № --</div>

<!-- Поле для власної суми -->
<div class="custom-input-container" id="customInputContainer">
<input type="number" id="customAmount" class="custom-input" placeholder="Сума подяки (грн)" min="1">
<button class="custom-submit-btn" onclick="submitCustomTip()">Оплатити з цією сумою</button>
</div>

<!-- Кнопки швидкого вибору -->
<div class="buttons-grid">
<button class="btn-option" onclick="payWithTip(0.06)">6%</button>
<button class="btn-option" onclick="payWithTip(0.10)">10%</button>
<button class="btn-option" onclick="payWithTip(0.20)">20%</button>
<button class="btn-option btn-custom" onclick="toggleCustomInput()">Інша сума</button>
</div>

<button class="btn-skip" onclick="payWithTip(0)">Без подяки</button>

<div class="footer">
<div>📍 вул. Френчка, 2</div>
<div>☎️ <a href="tel:+380000000000">+380 (00) 000-00-00</a></div>
<div>📷 <a href="https://instagram.com/latte_kropyvnytskyi" target="_blank">@latte_kropyvnytskyi</a></div>
</div>
</div>

<script>
// ===================================================
// НАЛАШТУВАННЯ TELEGRAM ГРУПИ
// ===================================================
const TG_BOT_TOKEN = '8882080931:AAEiYapGi1umRWuHEQat0f-cUtTEuJNiaj8'; 
const TG_CHAT_ID = '-1005428793005'; 

// Посилання Plata by mono (після отримання еквайрингу заміните на ваше реальне)
const MONO_PAYMENT_URL = 'https://plata.monobank.ua/pay/...'; 

// Отримання номера столу з URL (?table=1)
const urlParams = new URLSearchParams(window.location.search);
const tableNumber = urlParams.get('table') || '1';
document.getElementById('tableBadge').innerText = Стіл № ${tableNumber};

// Базова сума чека (за замовчуванням)
let billAmount = 200; 

function toggleCustomInput() {
const container = document.getElementById('customInputContainer');
container.style.display = container.style.display === 'block' ? 'none' : 'block';
if (container.style.display === 'block') {
document.getElementById('customAmount').focus();
}
}

function submitCustomTip() {
const customVal = parseFloat(document.getElementById('customAmount').value) || 0;
processPayment(customVal);
}

function payWithTip(percent) {
const tipAmount = Math.round(billAmount * percent);
processPayment(tipAmount);
}

async function processPayment(tip) {
const total = billAmount + tip;
const timeStr = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });

// Текст сповіщення в Telegram

Олександр:
const message = 
☕️ <b>Нова оплата / подяка в Latte!</b>\n\n +
📍 <b>Стіл:</b> №${tableNumber}\n +
🧾 <b>Рахунок:</b> ${billAmount} грн\n +
❤️ <b>Подяка:</b> ${tip} грн\n +
💳 <b>Разом:</b> ${total} грн\n +
🕒 <b>Час:</b> ${timeStr};

// Надсилання сповіщення в Telegram
try {
fetch(https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
chat_id: TG_CHAT_ID,
text: message,
parse_mode: 'HTML'
})
}).catch(err => console.error('TG Send Error:', err));
} catch (e) {
console.error(e);
}

// Перенаправлення на Plata by mono
const finalRedirectUrl = ${MONO_PAYMENT_URL}?amount=${total}&table=${tableNumber}&tip=${tip};

setTimeout(() => {
window.location.href = finalRedirectUrl;
}, 200);
}
</script>
</body>
</html>
