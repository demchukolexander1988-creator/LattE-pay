<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café LATTE — Оплата та подяка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
--gold-primary: #D4AF37;
--gold-light: #F3E5AB;
--purple-brand: #3D1E45;
--purple-dark: #2A1230;
--glass-bg: rgba(26, 12, 28, 0.88);
--glass-border: rgba(212, 175, 55, 0.4);
--text-light: #F8F5F0;
--text-muted: #C5B8C8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: 'Montserrat', sans-serif;
color: var(--text-light);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #0D050E url('background-wall.jpg') no-repeat center center fixed;
background-size: cover;
position: relative;
}

body::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(13, 5, 14, 0.65);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
z-index: 0; /* Виправлено: шар залишається під карткою */
pointer-events: none; /* Виправлено: шар не перехоплює кліки */
}

.container {
position: relative;
z-index: 10; /* Виправлено: картка та кнопки завжди поверх усього */
width: 100%;
max-width: 420px;
padding: 32px 20px 24px;
margin: 16px;
background: var(--glass-bg);
border: 1px solid var(--glass-border);
border-radius: 28px;
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
text-align: center;
}

.admin-toggle {
position: absolute;
top: 15px;
right: 20px;
background: transparent;
border: none;
color: var(--gold-primary);
font-size: 1.4rem;
cursor: pointer;
z-index: 20;
padding: 5px;
}

.logo {
width: 115px;
height: auto;
margin-bottom: 12px;
filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
}

.subtitle {
font-family: 'Cormorant Garamond', serif;
font-size: 1.4rem;
font-weight: 700;
color: var(--gold-primary);
margin-bottom: 6px;
}

.appreciation-text { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }

.table-badge {
display: inline-block;
padding: 5px 16px;
background: rgba(212, 175, 55, 0.15);
border: 1px solid var(--gold-primary);
border-radius: 20px;
font-size: 0.85rem;
color: var(--gold-primary);
margin-bottom: 10px;
font-weight: 600;
}

.bill-amount-display { font-size: 1.1rem; color: var(--text-light); margin-bottom: 20px; }
.bill-amount-display span { color: var(--gold-primary); font-weight: 700; font-size: 1.35rem; }

.buttons-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 10px;
margin-bottom: 10px;
}

.btn-option {
background: linear-gradient(145deg, var(--purple-brand), var(--purple-dark));
border: 1px solid var(--gold-primary);
color: var(--gold-light);
padding: 14px 6px;
font-size: 1rem;
font-weight: 600;
border-radius: 14px;
cursor: pointer;
font-family: 'Montserrat', sans-serif;
}

.btn-custom { grid-column: span 3; background: rgba(61, 30, 69, 0.7); }

Олександр:
.btn-skip {
width: 100%;
background: transparent;
border: 1px solid rgba(255, 255, 255, 0.2);
color: var(--text-muted);
padding: 12px;
font-size: 0.9rem;
border-radius: 14px;
cursor: pointer;
margin-top: 6px;
}

.custom-input-container, .admin-panel { display: none; margin-bottom: 14px; }

select, input {
width: 100%;
padding: 12px;
background: rgba(18, 7, 20, 0.9);
border: 1px solid var(--gold-primary);
border-radius: 12px;
color: var(--gold-primary);
font-size: 1.05rem;
text-align: center;
outline: none;
margin-bottom: 10px;
}

.custom-submit-btn, .btn-admin-save {
width: 100%;
padding: 12px;
background: var(--gold-primary);
color: #120F0D;
font-weight: 700;
border: none;
border-radius: 12px;
cursor: pointer;
}

.wish-text {
font-family: 'Cormorant Garamond', serif;
font-size: 1.05rem;
font-style: italic;
color: var(--gold-primary);
margin-top: 18px;
margin-bottom: 8px;
}

.footer {
margin-top: 14px;
padding-top: 12px;
border-top: 1px solid rgba(212, 175, 55, 0.2);
font-size: 0.8rem;
color: var(--text-muted);
line-height: 1.7;
}

.footer a { color: var(--gold-primary); text-decoration: none; }
</style>
</head>
<body>

<div class="container">
<button class="admin-toggle" onclick="toggleAdminView()" title="Панель офіціанта">⚙️</button>

<img src="logo-latte.png" alt="Latte Logo" class="logo">

<!-- БЛОК АДМІНІСТРАТОРА -->
<div class="admin-panel" id="adminPanel">
<div class="subtitle" style="margin-bottom:12px;">Панель офіціанта</div>
<label style="font-size:0.8rem; color:var(--gold-light); display:block; margin-bottom:4px;">Оберіть стіл:</label>
<select id="adminTableSelect">
<option value="1">Стіл № 1</option>
<option value="2">Стіл № 2</option>
<option value="3">Стіл № 3</option>
<option value="4">Стіл № 4</option>
<option value="5">Стіл № 5</option>
<option value="6">Стіл № 6</option>
<option value="7">Стіл № 7</option>
<option value="8">Стіл № 8</option>
</select>

<label style="font-size:0.8rem; color:var(--gold-light); display:block; margin-bottom:4px;">Сума чека (грн):</label>
<input type="number" id="adminBillInput" placeholder="Наприклад: 350">
<button class="btn-admin-save" onclick="saveAdminBill()">Встановити чек для столу</button>
<div id="adminStatus" style="font-size: 0.85rem; color: var(--gold-light); margin-top: 10px;"></div>
<hr style="border-color: var(--glass-border); margin: 15px 0;">
</div>

<!-- БЛОК КЛІЄНТА -->
<div id="guestPanel">
<div class="subtitle">Місце, де затишок та смак зустрічаються</div>
<div class="appreciation-text">Якщо вам сподобалось, команді буде дуже приємно ❤️</div>

<div class="table-badge" id="tableBadge">Стіл № --</div>
<div class="bill-amount-display" id="billDisplay">Рахунок: <span id="billValue">0</span> грн</div>

<div class="custom-input-container" id="customInputContainer">
<input type="number" id="customAmount" placeholder="Сума подяки (грн)" min="1">
<button class="custom-submit-btn" onclick="submitCustomTip()">Оплатити з цією сумою</button>
</div>

<div class="buttons-grid">
<button class="btn-option" onclick="payWithTip(0.06)">6%</button>
<button class="btn-option" onclick="payWithTip(0.10)">10%</button>
<button class="btn-option" onclick="payWithTip(0.20)">20%</button>
<button class="btn-option btn-custom" onclick="toggleCustomInput()">Інша сума</button>
</div>

<button class="btn-skip" onclick="payWithTip(0)">Без подяки</button>
</div>

<div class="wish-text">Дякуємо за довіру та бажаємо смачного! ❤️</div>

Олександр:
<div class="footer">
<div>📍 вул. Френчка, 2</div>
<div>☎️ <a href="tel:+380664554510">+380 (66) 455-45-10</a></div>
<div>📷 <a href="https://www.instagram.com/_lattecafe_?obrf=MWp2Y2d1MnZucGs4Nw==" target="_blank">@_lattecafe_</a></div>
</div>
</div>

<script>
const TG_BOT_TOKEN = '8882080931:AAEiYapGi1umRWuHEQat0f-cUtTEuJNiaj8'; 
const TG_CHAT_ID = '-1005428793005'; 
const MONO_PAYMENT_URL = 'https://plata.monobank.ua/pay/...'; 

const urlParams = new URLSearchParams(window.location.search);
const tableNumber = urlParams.get('table') || '1';
const isModeAdmin = urlParams.get('mode') === 'admin';

let billAmount = parseFloat(urlParams.get('bill')) || parseFloat(localStorage.getItem(table_bill_${tableNumber})) || 0;

document.getElementById('tableBadge').innerText = Стіл № ${tableNumber};
document.getElementById('billValue').innerText = billAmount;

// Автоматично відкриває адмінку, якщо в URL є ?mode=admin
if (isModeAdmin) {
document.getElementById('adminPanel').style.display = 'block';
}

function toggleAdminView() {
const panel = document.getElementById('adminPanel');
panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
}

function saveAdminBill() {
const selectedTable = document.getElementById('adminTableSelect').value;
const inputBill = parseFloat(document.getElementById('adminBillInput').value);

if (!inputBill || inputBill <= 0) {
alert('Введіть суму!');
return;
}

localStorage.setItem(table_bill_${selectedTable}, inputBill);
document.getElementById('adminStatus').innerHTML = ✅ Чек ${inputBill} грн збережено для Столу №${selectedTable}!;
}

function toggleCustomInput() {
const container = document.getElementById('customInputContainer');
container.style.display = (container.style.display === 'block') ? 'none' : 'block';
}

function submitCustomTip() {
const customVal = parseFloat(document.getElementById('customAmount').value) || 0;
processPayment(customVal);
}

function payWithTip(percent) {
const tipAmount = Math.round(billAmount * percent);
processPayment(tipAmount);
}

async function processPayment(tip) {
const total = billAmount + tip;
const timeStr = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
const message = ☕️ <b>Нова оплата в Latte!</b>\n\n📍 <b>Стіл:</b> №${tableNumber}\n🧾 <b>Рахунок:</b> ${billAmount} грн\n❤️ <b>Подяка:</b> ${tip} грн\n💳 <b>Разом:</b> ${total} грн\n🕒 <b>Час:</b> ${timeStr};

try {
fetch(https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ chat_id: TG_CHAT_ID, text: message, parse_mode: 'HTML' })
}).catch(err => console.error(err));
} catch (e) {}

window.location.href = ${MONO_PAYMENT_URL}?amount=${total}&table=${tableNumber}&tip=${tip};
}
</script>
</body>
</html>
