:root {
--gold-primary: #D4AF37;
--gold-light: #F3E5AB;
--purple-brand: #3D1E45;
--purple-dark: #2A1230;
--purple-hover: #52275C;
--glass-bg: rgba(26, 12, 28, 0.65);
--glass-border: rgba(212, 175, 55, 0.35);
--text-light: #F8F5F0;
--text-muted: #C5B8C8;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: 'Montserrat', sans-serif;
color: var(--text-light);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #0D050E url('background-wall.jpg') no-repeat center center fixed;
background-size: cover;
position: relative;
overflow-x: hidden;
}

/* Фонові затемнення (45%) та золотисті відблиски */
body::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: 
radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.25) 0%, transparent 40%),
radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.18) 0%, transparent 45%),
linear-gradient(135deg, rgba(13, 5, 14, 0.45) 0%, rgba(26, 12, 28, 0.55) 100%);
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
z-index: 1;
}

/* Glassmorphism картка */
.container {
position: relative;
z-index: 2;
width: 100%;
max-width: 420px;
padding: 36px 24px 28px;
margin: 16px;
background: var(--glass-bg);
border: 1px solid var(--glass-border);
border-radius: 28px;
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
box-shadow: 
0 20px 50px rgba(0, 0, 0, 0.7),
inset 0 1px 1px rgba(255, 255, 255, 0.15),
0 0 30px rgba(212, 175, 55, 0.15);
text-align: center;
}

/* Логотип яскравий із золотим сяйвом */
.logo {
width: 125px;
height: auto;
margin-bottom: 16px;
filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4));
}

font-family: 'Cormorant Garamond', serif;
font-size: 1.45rem;
font-weight: 700;
color: var(--gold-primary);
margin-bottom: 8px;
letter-spacing: 0.5px;
}

.appreciation-text {
font-size: 0.92rem;
color: var(--text-muted);
margin-bottom: 20px;
line-height: 1.4;
}

margin-bottom: 10px;
font-weight: 600;
letter-spacing: 1px;
}
